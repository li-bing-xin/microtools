name: ci

on:
  push:
    branches: [main]
  pull_request:

# 站点仓库的标准 CI（生成时随模板复制进站点根）。
# 顺序：安装 → build（按模式跑构建链）→ typecheck（含 src/shared）→ test（shared 边界自检 + rng 冒烟）。
# main 上再加一个 deploy job：cf deploy（读 cloudflare.config.ts，站点唯一的部署配置），
# 上线后校验 deploy-marker 的 sha。
# 账号 ID 由 create-site 的 --account-id 参数化写入；没给时退回仓库变量 vars.CLOUDFLARE_ACCOUNT_ID。
# CLOUDFLARE_API_TOKEN 放 GitHub Secrets（cf auth login 是交互式的，CI 里跑不通）。
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      # build 按模式跑：spa = vite build + 模式校验；prerender = + 预渲染 + sitemap 覆盖率校验
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency: deploy-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: __CLOUDFLARE_ACCOUNT_ID__
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      # cf deploy 自己跑 Vite 构建（含预渲染 + 校验链），不需要先 npm run build。
      # 固定版本号，避免 beta 期上游变更悄悄改变部署行为。
      - run: npx --yes cf@1.0.0-beta.19 deploy
      - name: verify the deployed sha
        run: >-
          node scripts/verify-deploy.mjs ${{ github.sha }}
          --url __SITE_URL__/deploy-marker.txt
