name: ci

on:
  push:
    branches: [main]
  pull_request:

# 复制到独立站点仓库根（.github/workflows/ci.yml）即可用。
# 在 microtools monorepo 里由根 workflow 统一跑，本文件是「站点被拆出去」时的备份。
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # build 按模式跑：spa = vite build + 模式校验；prerender = + 预渲染 + sitemap 覆盖率校验
      - run: pnpm -r build
      - run: pnpm -r typecheck
